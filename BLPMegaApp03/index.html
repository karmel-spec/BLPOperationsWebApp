<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>BLP Operating System</title>
    <link rel="stylesheet" href="./styles.css?v=nav-restructure-20260730" />
  </head>
  <body>
    <header class="global-bar" aria-label="Global command">
      <a class="global-brand" href="./index.html" aria-label="BLP Team Operating System home">
        <img src="./assets/brand/blp-logo.png" alt="Brigham Larson Pianos" />
      </a>

      <div class="hamburger-menu">
        <button type="button" class="hamburger-toggle" id="hamburgerToggle" aria-haspopup="true" aria-expanded="false" aria-controls="hamburgerDropdown">
          <span></span><span></span><span></span>
          <span class="sr-only">Menu</span>
        </button>
        <nav class="hamburger-dropdown" id="hamburgerDropdown" aria-label="Sections" hidden>
          <a href="./index.html#preview" aria-current="page">Preview Studio</a>
          <a href="./expansion-map.html">Expansion Map</a>
          <a href="./settings.html">Settings</a>
        </nav>
      </div>

      <label class="command-search">
        <span>Ask, search, or route work</span>
        <input type="search" placeholder="Find a customer, assign an agent, open tuning schedule..." />
      </label>

      <a class="primary small" href="./i-have-11-agents-2-in/index.html">New Request</a>
    </header>

    <div class="app-shell">
      <aside class="sidebar" aria-label="Live modules">
        <section class="sidebar-signals" aria-label="Operating status">
          <div id="signalList" class="signal-list"></div>
        </section>
      </aside>

      <main>
        <section class="recent-updates-panel" aria-label="Recently updated modules">
          <header class="section-heading compact">
            <div>
              <p class="eyebrow">Recently updated modules</p>
              <h3>Latest module movement</h3>
            </div>
          </header>
          <div class="recent-updates-grid" id="recentUpdatesGrid"></div>
        </section>

        <section id="preview" class="section-heading preview-heading">
          <div>
            <p class="eyebrow">Preview Studio</p>
            <h3>Open modules inside the BLP frame</h3>
          </div>
          <span id="previewStatus">Sales Console</span>
        </section>
        <section class="module-preview" data-size="desktop">
          <header class="preview-toolbar">
            <div>
              <p class="eyebrow" id="previewOwner">Sales and showroom</p>
              <select id="previewModuleSelect" class="preview-module-select" aria-label="Choose module to preview"></select>
            </div>
            <div class="preview-actions">
              <div class="viewport-controls" aria-label="Preview viewport size">
                <button type="button" data-preview-size="desktop" class="is-active">Desktop</button>
                <button type="button" data-preview-size="tablet">Tablet</button>
                <button type="button" data-preview-size="mobile">Mobile</button>
                <button type="button" data-preview-size="wide">Wide</button>
              </div>
              <a class="secondary small" id="previewOpenLink" href="https://blpsalesapp.netlify.app/" target="_blank" rel="noreferrer">Open separately</a>
            </div>
          </header>
          <div class="preview-frame-shell">
            <iframe
              id="moduleFrame"
              class="preview-frame"
              title="Sales Console"
              src="https://blpsalesapp.netlify.app/"
            ></iframe>
          </div>
        </section>
      </main>
    </div>

    <script src="./app.js?v=nav-restructure-20260730"></script>
  </body>
</html>
